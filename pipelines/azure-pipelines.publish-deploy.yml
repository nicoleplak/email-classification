# The build number is also used as the immutable image tag: yyyyMMdd.r
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

pool:
  name: vmadoagentprd_pool

stages:

  # ============================================================
  # BUILD & PUSH
  # ============================================================
  - stage: Build
    displayName: 'Build & push to ACR'

    jobs:
      - job: build
        displayName: 'docker build + push'

        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail

              az login --identity
              az account set --subscription 753ed49c-40d0-4289-8730-3db54951ce44

              az acr update \
                --name craiplatformsharedgrprd \
                --admin-enabled true \
                --output none

              ACR_USER=$(az acr credential show \
                --name craiplatformsharedgrprd \
                --query username \
                -o tsv)

              ACR_PASS=$(az acr credential show \
                --name craiplatformsharedgrprd \
                --query passwords[0].value \
                -o tsv)

              echo "$ACR_PASS" | docker login craiplatformsharedgrprd.azurecr.io \
                --username "$ACR_USER" \
                --password-stdin

              # Push target: AcrPush via the agent's managed identity.
              # `az acr login` needs ARM read on the registry to resolve its suffixed login
              # server, which the identity doesn't have, so exchange the Entra token directly.
              TARGET=acrdatallm-b2fabgebc6a7dygd.azurecr.io
              AAD_TOKEN=$(az account get-access-token --query accessToken -o tsv)
              ACR_REFRESH=$(curl -sS --fail -X POST "https://$TARGET/oauth2/exchange" \
                --data-urlencode "grant_type=access_token" \
                --data-urlencode "service=$TARGET" \
                --data-urlencode "access_token=$AAD_TOKEN" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["refresh_token"])')

              echo "$ACR_REFRESH" | docker login $TARGET \
                --username 00000000-0000-0000-0000-000000000000 \
                --password-stdin
            displayName: 'Login to ACR'

          - script: |
              set -euo pipefail

              docker build \
                -t acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:$(Build.BuildNumber) \
                -t acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:latest \
                -f $(Build.SourcesDirectory)/Dockerfile \
                $(Build.SourcesDirectory)
            displayName: 'Docker build'

          - script: |
              set -euo pipefail

              docker push acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:$(Build.BuildNumber)
              docker push acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:latest
            displayName: 'Docker push'


  # ============================================================
  # DEPLOY
  # ============================================================
  - stage: Deploy
    displayName: 'Deploy to Container App'
    dependsOn: Build

    jobs:
      - job: deploy
        displayName: 'az containerapp update'

        steps:
          - checkout: none

          - script: |
              set -euo pipefail

              az login --identity
              az account set --subscription 753ed49c-40d0-4289-8730-3db54951ce44

              az containerapp update \
                --name ca-emclf-llm-gr \
                --resource-group LLM \
                --image acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:$(Build.BuildNumber)
            displayName: 'Update Container App image'

          # The scheduled job is what actually runs ingest (and, when enabled, the classifier).
          - script: |
              set -euo pipefail

              az login --identity
              az account set --subscription 753ed49c-40d0-4289-8730-3db54951ce44

              # The agent identity needs a role on the job (e.g. Contributor on caj-job-emclf-llm-gr); without
              # it Azure answers "does not exist". Until IT grants it, warn and let the app deploy finish;
              # point the job at the image by hand: az containerapp job update ... --image <same tag>.
              if ! az containerapp job update \
                --name caj-job-emclf-llm-gr \
                --resource-group LLM \
                --image acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:$(Build.BuildNumber); then
                echo "##vso[task.logissue type=warning]Job image not updated (no permission on caj-job-emclf-llm-gr?). Update it by hand to $(Build.BuildNumber)."
                echo "##vso[task.complete result=SucceededWithIssues;]"
              fi
            displayName: 'Update scheduled job image'

          - script: |
              set -euo pipefail

              az login --identity
              az account set --subscription 753ed49c-40d0-4289-8730-3db54951ce44

              IMAGE="acrdatallm-b2fabgebc6a7dygd.azurecr.io/email-classification:$(Build.BuildNumber)"

              for i in $(seq 1 30); do

                STATE="$(az containerapp revision list \
                  --name ca-emclf-llm-gr \
                  --resource-group LLM \
                  --query "[?properties.template.containers[0].image=='$IMAGE'] | [0].{p:properties.provisioningState,r:properties.runningState,h:properties.healthState}" \
                  -o tsv)"

                echo "$(date -u +%H:%M:%S) ${STATE:-no revision yet}"

                case "$STATE" in

                  *Provisioned*Running*Healthy*|*Provisioned*Running*None*)
                    echo "revision is up"
                    exit 0
                    ;;

                  *Failed*)
                    echo "##vso[task.logissue type=error]revision failed - see the app's logs in Log Analytics"
                    exit 1
                    ;;

                esac

                sleep 20
              done

              echo "##vso[task.logissue type=error]revision not running after 10 minutes"
              exit 1
            displayName: 'Monitor deployment until healthy'